[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qbo-ar"
version = "0.2.1"
description = "Accounts Receivable toolkit for the QuickBooks Online API: aging, payments, reconciliation, dunning"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Paul Kamau Nyoike" }]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "types-requests"]

[project.scripts]
qbo-ar = "qbo_ar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["qbo_ar", "qbd_ar"]

[tool.coverage.report]
fail_under = 93
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.10"
files = ["src/qbo_ar", "src/qbd_ar"]
warn_unused_ignores = true
warn_redundant_casts = true
